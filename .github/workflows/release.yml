name: Release

# Push a tag like v1.2.3 (or v1.2.3-beta.1 for a pre-release) to build and publish a GitHub Release.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Build
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          dotnet build TBMini.csproj -c Release -nologo "-p:Version=$version"

      - name: Package
        shell: pwsh
        run: |
          $name = "TBMini-$($env:TAG)-win-x64"
          New-Item -ItemType Directory "dist/$name" | Out-Null
          Copy-Item bin/Release/TBMini.exe, bin/Release/TBMini.exe.config, LICENSE "dist/$name/"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip`n" | Out-File -Encoding ascii -NoNewline dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $flags = @('--title', "TBMini $($env:TAG)", '--generate-notes', '--verify-tag')
          if ($env:TAG -like '*-*') { $flags += '--prerelease' }
          gh release create $env:TAG "dist/TBMini-$($env:TAG)-win-x64.zip" dist/SHA256SUMS.txt @flags
