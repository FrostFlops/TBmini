name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build TBMini.csproj -c Release -nologo

      - name: Upload build
        uses: actions/upload-artifact@v6
        with:
          name: TBMini-${{ github.sha }}
          path: |
            bin/Release/TBMini.exe
            bin/Release/TBMini.exe.config
          if-no-files-found: error
